name: CI

on:
  pull_request:
    branches: [main]

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # O emulador do Firestore roda em Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      # Os testes precisam dos emuladores de Auth, Firestore e Functions rodando; o emulators:exec sobe, roda os testes e derruba
      - run: npx --yes firebase-tools@15.32.0 emulators:exec --only auth,firestore,functions --project atendeai-teste-local "npm --prefix functions test"
        working-directory: .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
